[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotiny"
version = "1.0.0"
description = "Fast multilingual emotion classification for real-time applications."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Mekhy W." }]
dependencies = [
  "sentence-transformers>=2.2.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0",
  "joblib>=1.3.0",
  "onnxruntime>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["emotiny*"]